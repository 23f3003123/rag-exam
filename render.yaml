services:
  - type: web
    name: rag-exam
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python warmup.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANTHROPIC_API_KEY
        sync: false
